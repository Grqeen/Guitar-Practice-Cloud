<section class="card">
  <h1>Connexion</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" placeholder="nom@exemple.com" />
      @if (form.controls.email.invalid && (form.controls.email.touched || submitted())) {
        <span class="field-error">
          @if (form.controls.email.hasError('required')) {
            L'adresse email est requise.
          } @else if (form.controls.email.hasError('email')) {
            Format d'adresse email invalide.
          }
        </span>
      }
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" placeholder="Votre mot de passe" />
      @if (form.controls.password.invalid && (form.controls.password.touched || submitted())) {
        <span class="field-error">Le mot de passe est requis.</span>
      }
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion en cours...' : 'Se connecter' }}
    </button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p><a routerLink="/register">Créer un compte</a></p>
</section>
