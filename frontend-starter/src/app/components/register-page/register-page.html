<section class="card">
  <h1>Créer un compte</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nom
      <input formControlName="name" placeholder="Votre nom complet" />
      @if (form.controls.name.invalid && (form.controls.name.touched || submitted())) {
        <span class="field-error">
          @if (form.controls.name.hasError('required')) {
            Le nom est requis.
          } @else if (form.controls.name.hasError('minlength')) {
            Le nom doit comporter au moins 2 caractères.
          }
        </span>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" placeholder="nom@exemple.com" />
      @if (form.controls.email.invalid && (form.controls.email.touched || submitted())) {
        <span class="field-error">
          @if (form.controls.email.hasError('required')) {
            L'adresse email est requise.
          } @else if (form.controls.email.hasError('email')) {
            Format d'adresse email invalide.
          }
        </span>
      }
    </label>

    <label>
      Mot de passe (8 caractères minimum)
      <input type="password" formControlName="password" placeholder="Minimum 8 caractères" />
      @if (form.controls.password.invalid && (form.controls.password.touched || submitted())) {
        <span class="field-error">
          @if (form.controls.password.hasError('required')) {
            Le mot de passe est requis.
          } @else if (form.controls.password.hasError('minlength')) {
            Le mot de passe doit comporter au moins 8 caractères.
          }
        </span>
      }
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Création en cours...' : 'Créer mon compte' }}
    </button>
  </form>

  @if (error()) {
    <p class="error">{{ error() }}</p>
  }

  <p><a routerLink="/login">Déjà inscrit ? Se connecter</a></p>
</section>
